<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="pagina do produto Techboard">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Techboard</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="app">
         <header>
            <div class="logo-container">
                <img src="./imgs/Favicon2.png" alt="icone do projeto">
                <p>Techboard</p>
            </div>
            <nav class="nav-header">
                <button class="dark-mode">
                    <img src="./imgs/Modos.svg" alt="dark mode icon">
                </button>
            </nav>
         </header>

         <main>
              <section class="main-hero">
                   <h1> <span>Fique de olho</span> no que importa</h1>
                   <p>Monitoramento em tempo real com alertas inteligentes para sua aplicação nunca sair do ar sem você saber.</p>
                   <button class="main-btn">
                        Testar versão demo
                   </button>
                   <div class="main-hero-img">
                      <img src="./imgs/banner-desktop.png" alt="banner site" class="hero-img">
                   </div>
              </section>
         </main>

    </div>
</body>
</html>
